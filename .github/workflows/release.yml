name: Release

# Al subir una etiqueta de versión (git tag -a v0.3.0 && git push origin v0.3.0),
# compila ttpblast para Windows, Linux y macOS y publica los binarios en una
# release de GitHub, para usarlo sin instalar Rust. Las notas son la sección de
# esa versión en CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Empaquetar
        shell: bash
        run: |
          name="ttpblast-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md README.en.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp -r alphabet queries scripts experiments "$name"/
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/ttpblast.exe" "$name"/
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/ttpblast" "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Notas de la versión (su sección del CHANGELOG)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md no tiene una sección para $version" >&2
            exit 1
          fi
          printf '\n**Binarios**: descomprime el de tu sistema y prueba `ttpblast demo` (no hace falta nada más). Cambios completos en [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: ttpblast-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
