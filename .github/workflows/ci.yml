name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Demo guiada y biblioteca de consultas de principio a fin
        shell: bash
        run: |
          cargo run --release -- demo --details 1
          cargo run --release -- search --query queries/ransomware-preludio.txt --events data/demo/events.ndjson --details 0 --lang en
          cargo run --release -- hunt --events data/demo/events.ndjson --html data/demo/hunt
      - name: Informes HTML de la demo
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: informes-demo
          path: |
            data/demo/*.html
            data/demo/hunt/*.html
          retention-days: 14
      - name: demo.cmd (cmd.exe)
        if: runner.os == 'Windows'
        shell: cmd
        run: demo.cmd --details 0 --no-html
      - name: Sintaxis de export-sysmon.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\export-sysmon.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
