name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Demo de principio a fin
        shell: bash
        run: |
          cargo run --release -- synth --out data/demo
          cargo run --release -- search --query queries/phishing-lateral.txt --events data/demo/events.ndjson --details 1
      - name: demo.cmd (cmd.exe)
        if: runner.os == 'Windows'
        shell: cmd
        run: demo.cmd --details 0
      - name: Sintaxis de export-sysmon.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\export-sysmon.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
