name: Sysmon lab

# Laboratorio en una máquina Windows desechable de GitHub: instala Sysmon con
# los mismos comandos del README, activa la auditoría de creación de procesos,
# genera actividad benigna (compilar, comandos de administración habituales y
# una descarga web) y comprueba que ttpblast codifica esos comandos por tres
# caminos: el NDJSON de scripts/export-sysmon.ps1, el registro de Sysmon leído
# como .evtx y el de Seguridad (evento 4688), también como .evtx.
# Se lanza a mano (Actions → Sysmon lab → Run workflow), en main o en un PR
# cuando cambia algo de la lectura de eventos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/export-sysmon.ps1'
      - 'src/sysmon.rs'
      - 'src/windows.rs'
      - 'src/evtx.rs'
      - 'src/events.rs'
      - 'alphabet/**'
      - '.github/workflows/sysmon-lab.yml'
  pull_request:
    paths:
      - 'scripts/export-sysmon.ps1'
      - 'src/sysmon.rs'
      - 'src/windows.rs'
      - 'src/evtx.rs'
      - 'src/events.rs'
      - 'alphabet/**'
      - '.github/workflows/sysmon-lab.yml'

jobs:
  lab:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar Sysmon (los mismos comandos que el README) y auditar procesos
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:\Tools\Sysmon | Out-Null
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile C:\Tools\Sysmon\Sysmon.zip
          Expand-Archive C:\Tools\Sysmon\Sysmon.zip -DestinationPath C:\Tools\Sysmon -Force
          Invoke-WebRequest https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml -OutFile C:\Tools\Sysmon\sysmonconfig.xml
          C:\Tools\Sysmon\Sysmon64.exe -accepteula -i C:\Tools\Sysmon\sysmonconfig.xml
          Get-Service Sysmon64
          # Creación de procesos (evento 4688 de Seguridad), por GUID para no
          # depender del idioma de Windows.
          auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Actividad benigna
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\target\release\ttpblast.exe synth --out data\demo | Out-Null
          # Output is read in full: cutting it short (Select-Object -First)
          # leaves the command with a broken pipe and a non-zero exit code.
          whoami
          hostname
          systeminfo | Out-Null
          schtasks /query /fo LIST | Out-Null
          net user | Out-Null
          ipconfig | Out-Null
          tasklist | Out-Null
          Invoke-WebRequest https://example.com -UseBasicParsing | Out-Null
          Start-Sleep -Seconds 15
          # Only the build decides whether this step failed.
          exit 0

      - name: Exportar y analizar
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\export-sysmon.ps1 -Days 1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\target\release\ttpblast.exe encode --events data\sysmon\events.ndjson --unmatched 20 | Tee-Object -FilePath data\sysmon\encode.txt
          .\target\release\ttpblast.exe search --query queries\phishing-lateral.txt --events data\sysmon\events.ndjson --details 1 --html data\sysmon\informe.html
          .\target\release\ttpblast.exe search --query queries\phishing-lateral.txt --events data\sysmon\events.ndjson --json | Out-File -Encoding utf8 data\sysmon\result.json
          # The same activity, straight from the event logs.
          New-Item -ItemType Directory -Force data\evtx | Out-Null
          wevtutil epl Microsoft-Windows-Sysmon/Operational data\evtx\sysmon.evtx
          wevtutil epl Security data\evtx\security.evtx
          .\target\release\ttpblast.exe encode --events data\evtx\sysmon.evtx --unmatched 10 | Tee-Object -FilePath data\sysmon\encode-sysmon-evtx.txt
          .\target\release\ttpblast.exe encode --events data\evtx\security.evtx --unmatched 10 | Tee-Object -FilePath data\sysmon\encode-security-evtx.txt
          .\target\release\ttpblast.exe hunt --events data\evtx --html data\sysmon\hunt | Tee-Object -FilePath data\sysmon\hunt.txt

      - name: Comprobar que los comandos del laboratorio se codifican
        run: |
          function Require($file, $symbols, $label) {
            $sequence = (Get-Content $file)[0]
            foreach ($symbol in $symbols) {
              if ($sequence -notmatch "\b$symbol\b") {
                Write-Host "Falta $symbol en ${label}: $sequence"
                exit 1
              }
            }
            Write-Host "OK ${label}: $sequence"
          }
          # whoami (USR), hostname y systeminfo (SID), schtasks (TSK), PowerShell (PSH).
          Require data\sysmon\encode.txt @('USR', 'SID', 'TSK', 'PSH') 'NDJSON exportado'
          Require data\sysmon\encode-sysmon-evtx.txt @('USR', 'SID', 'TSK', 'PSH') 'Sysmon .evtx'
          Require data\sysmon\encode-security-evtx.txt @('USR', 'SID', 'TSK') 'Seguridad 4688 .evtx'
          # Símbolos añadidos en la v0.2, de net, ipconfig y tasklist: se informa, sin fallar.
          $sequence = (Get-Content data\sysmon\encode.txt)[0]
          foreach ($symbol in 'ACD', 'NCD', 'PRC') {
            $seen = if ($sequence -match "\b$symbol\b") { 'sí' } else { 'no' }
            Write-Host "$symbol aparece: $seen"
          }

      # Only ttpblast's own output: the raw .evtx of the runner stay on it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sysmon-lab
          path: data/sysmon/
          retention-days: 7
