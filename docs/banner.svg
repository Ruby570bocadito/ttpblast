<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="ttl desc">
<title id="ttl">ttpblast — Encuentra la variante escondida en el ruido</title>
<desc id="desc">Una cadena de ataque consultada se alinea localmente con la que ejecutó un host: 5 pasos coinciden y 4 son sustituciones de la misma táctica. La puntuación del alineamiento cae en la cola de lo esperable por azar; E = 1,8 × 10⁻⁴, improbable por azar.</desc>
<rect width="1200" height="360" rx="18" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#30363d"/>

<!-- marca -->
<text x="56" y="104" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="-1" fill="#e6edf3">ttp<tspan fill="#2dd4bf">blast</tspan></text>
<text x="58" y="136" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="20" fill="#8b949e">Encuentra la variante escondida en el ruido</text>
<rect x="56" y="152" width="226" height="24" rx="12" fill="none" stroke="#30363d"/>
<text x="68" y="169" font-family="'Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#8b949e">demo de investigación · v0.2</text>

<!-- alineamiento consulta / host -->
<rect x="56" y="200" width="660" height="124" rx="12" fill="none" stroke="#30363d"/>
<text x="142" y="240" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-style="italic" font-size="14" fill="#8b949e">consulta</text>
<text x="142" y="304" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-style="italic" font-size="14" fill="#8b949e">host</text>

<g font-family="'Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="middle">
<!-- fila consulta (teal) -->
<g font-size="17" font-weight="600" fill="#2dd4bf">
<text x="176" y="240">UEX</text><text x="235" y="240">PSH</text><text x="294" y="240">C2W</text><text x="353" y="240">ITT</text><text x="412" y="240">RUN</text><text x="471" y="240">USR</text><text x="530" y="240">SID</text><text x="589" y="240">LSA</text><text x="648" y="240">SMB</text>
</g>
<!-- conectores: | coincide (verde), + sustituye (ámbar) -->
<g font-size="19" font-weight="700">
<text x="176" y="273" fill="#4ade80">|</text><text x="235" y="273" fill="#fbbf24">+</text><text x="294" y="273" fill="#4ade80">|</text><text x="353" y="273" fill="#4ade80">|</text><text x="412" y="273" fill="#fbbf24">+</text><text x="471" y="273" fill="#4ade80">|</text><text x="530" y="273" fill="#fbbf24">+</text><text x="589" y="273" fill="#4ade80">|</text><text x="648" y="273" fill="#fbbf24">+</text>
</g>
<!-- fila host: verde si coincide, ámbar si sustituye -->
<g font-size="17" font-weight="600">
<text x="176" y="304" fill="#4ade80">UEX</text><text x="235" y="304" fill="#fbbf24">CMD</text><text x="294" y="304" fill="#4ade80">C2W</text><text x="353" y="304" fill="#4ade80">ITT</text><text x="412" y="304" fill="#fbbf24">TSK</text><text x="471" y="304" fill="#4ade80">USR</text><text x="530" y="304" fill="#fbbf24">RSD</text><text x="589" y="304" fill="#4ade80">LSA</text><text x="648" y="304" fill="#fbbf24">WRM</text>
</g>
</g>
<text x="56" y="346" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">alineamiento local: la cadena buscada frente a la que ejecutó un host</text>

<!-- separador de columnas -->
<line x1="734" y1="72" x2="734" y2="316" stroke="#30363d"/>

<!-- conclusión estadística -->
<text x="1144" y="72" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="2.5" fill="#8b949e">CONCLUSIÓN ESTADÍSTICA</text>
<text x="1144" y="116" text-anchor="end" font-family="'Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="40" font-weight="700" fill="#ff7b72">E = 1,8 × 10⁻⁴</text>
<text x="1144" y="142" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">improbable por azar</text>

<!-- distribución nula: señal sobre ruido -->
<line x1="752" y1="300" x2="1138" y2="300" stroke="#30363d"/>
<path d="M 760 300 C 795 300 820 228 842 224 C 866 220 888 252 912 272 C 952 298 1030 300 1130 300" fill="rgba(139,148,158,0.14)" stroke="#8b949e" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="842" y="212" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">esperado por azar</text>
<line x1="985" y1="300" x2="985" y2="222" stroke="#8b949e" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 4"/>
<text x="985" y="214" text-anchor="middle" font-family="'Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#8b949e">umbral E = 0,01</text>
<line x1="1095" y1="300" x2="1095" y2="214" stroke="#ff7b72" stroke-width="2"/>
<circle cx="1095" cy="214" r="3.5" fill="#ff7b72"/>
<text x="1095" y="202" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#ff7b72">observado</text>
<text x="752" y="318" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">puntuación del alineamiento →</text>
</svg>
